<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="ballGradient" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Basketball Body -->
  <circle cx="50" cy="50" r="44" fill="url(#ballGradient)" filter="url(#shadow)" stroke="#431407" stroke-width="3"/>
  <!-- Basketball Seams -->
  <line x1="6" y1="50" x2="94" y2="50" stroke="#261005" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="6" x2="50" y2="94" stroke="#261005" stroke-width="3" stroke-linecap="round"/>
  <path d="M 22 13 C 38 27, 38 73, 22 87" fill="none" stroke="#261005" stroke-width="3" stroke-linecap="round"/>
  <path d="M 78 13 C 62 27, 62 73, 78 87" fill="none" stroke="#261005" stroke-width="3" stroke-linecap="round"/>
  <!-- Highlight reflection -->
  <ellipse cx="36" cy="28" rx="14" ry="7" transform="rotate(-30 36 28)" fill="#ffffff" opacity="0.22"/>
</svg>